<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d0f15" />
    <meta
      name="description"
      content="Meet ORBIT. Explore a calmer way to connect projects, people, and plans in one workspace. Interactive product and pricing preview."
    />
    <link rel="icon" type="image/svg+xml" href="/orbit.svg" />
    <title>ORBIT — Make space for great work</title>
    <script>
      (() => {
        let preference = 'dark';
        try {
          const stored = localStorage.getItem('orbit.theme.v1');
          if (['dark', 'light', 'system'].includes(stored)) preference = stored;
        } catch {}
        document.documentElement.dataset.theme =
          preference === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : preference;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
