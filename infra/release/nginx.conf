worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    # Do not log URLs, query strings, cookies or request bodies.
    log_format safe '$request_method $status $body_bytes_sent $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_header_timeout 15s;
    client_body_timeout 30s;
    keepalive_timeout 30s;
    send_timeout 30s;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8443 ssl;
        ssl_certificate /run/tls/fullchain.pem;
        ssl_certificate_key /run/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_tickets off;
        root /usr/share/nginx/html;
        client_max_body_size 11m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # React/Radix use style attributes; JavaScript never permits inline/eval.
        # PDF.js codecs require WebAssembly compilation, not JavaScript eval.
        # PDF workers and authorized local previews require blob URLs.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Cache-Control $orbit_cache always;
        location = /healthz { return 200 'alive'; }
        location /api/ {
            proxy_pass http://api:4000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 90s;
            proxy_send_timeout 30s;
            proxy_buffering off;
            proxy_hide_header Cache-Control;
        }
        location /assets/ { try_files $uri =404; }
        location /pdfjs/ { try_files $uri =404; }
        location ~ /\. { return 404; }
        location ~ \.map$ { return 404; }
        # nginx's default MIME table omits .mjs; module PDF workers require JS MIME.
        location ~ \.(mjs|wasm)$ {
            types { application/javascript mjs; application/wasm wasm; }
            try_files $uri =404;
        }
        location / { try_files $uri $uri/ /index.html; }
    }
    map "$status:$uri" $orbit_cache {
        default "no-store";
        ~^(200|304):/assets/ "public, max-age=31536000, immutable";
    }
}
